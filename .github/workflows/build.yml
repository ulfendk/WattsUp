name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test wattsup/app/WattsUp.slnx

  # Publishes a multi-arch image (amd64 for the devcontainer/other machines, arm64 for HA Blue)
  # only on version tags - everyday pushes just run the tests above. See wattsup/DOCS.md for the
  # local-build alternative while iterating.
  publish-image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # GHCR image paths must be lowercase; the repo itself ("ulfendk/WattsUp") isn't.
      - id: image
        run: echo "repo=$(echo 'ghcr.io/${{ github.repository }}/wattsup' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: wattsup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.repo }}:latest
