<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <base href="/WattsUp/" />
    <title>WattsUp — public demo</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="stylesheet" href="_content/WattsUp.Core/css/app.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />

</head>

<body>
    <div id="app">
        <div class="loading-shell">Loading WattsUp…</div>

        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/WattsUp.Core/theme.js"></script>

    <script src="secretsInterop.js"></script>

</html>
