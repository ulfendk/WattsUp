name: "WattsUp"
version: "0.1.1"
slug: "wattsup"
description: "Danish electricity price tracker and cost breakdown"
url: "https://github.com/ulfendk/WattsUp"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: WattsUp
# Not admin-only — pricing/tariff settings are household-wide, not sensitive per-user data.
panel_admin: false
hassio_api: true

# Auto-discovers a configured MQTT broker (e.g. the Mosquitto add-on) to publish HA sensor
# entities via MQTT Discovery. WattsUp runs fine with this unavailable — it just skips publishing.
services:
  - mqtt:want

# Included in normal HA backups without needing to stop the add-on first.
backup: hot

options:
  eloverblik_refresh_token: ""
  carnot_api_key: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  log_level: "info"
schema:
  eloverblik_refresh_token: "password?"
  carnot_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  log_level: "list(trace|debug|info|warning|error)?"

# No "image:" here on purpose: once set, Supervisor always tries to PULL that tag and does NOT
# fall back to a local build if the pull fails. Leaving it unset makes Supervisor build straight
# from the Dockerfile below, which is what you want both for local development and until you've
# actually published a matching image. Once ready to publish: push a "vX.Y.Z" git tag matching
# `version` above (triggers .github/workflows/build.yml), make the resulting GHCR package public,
# THEN add back:
#   image: ghcr.io/ulfendk/wattsup/wattsup
